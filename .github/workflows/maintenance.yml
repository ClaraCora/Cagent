name: maintenance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  corrections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Resolve security updates and format on Linux
        run: |
          cargo update -p rustls --precise 0.23.45
          cargo fmt --all
          git diff > maintenance.patch
      - uses: actions/upload-artifact@v7
        with:
          name: maintenance
          path: maintenance.patch
